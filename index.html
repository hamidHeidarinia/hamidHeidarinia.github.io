        if (localStorage.getItem('theme') === 'dark' ||

<body
    class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased transition-colors duration-300"
    x-data="{ dark: document.documentElement.classList.contains('dark') }"

    <div class="min-h-screen sm:py-6 lg:py-10">

                ">
                    <!-- top-right controls: dark mode toggle + language selector -->
                    <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-20 flex items-center gap-2">
        
                        <!-- dark mode toggle -->
                        <button @click="dark = !dark"
                            class="focus-ring flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 bg-white/95 dark:bg-slate-800/95 border border-slate-200 dark:border-slate-700 rounded-md shadow-sm hover:bg-white dark:hover:bg-slate-700 transition"
                            :aria-label="dark ? 'Switch to light mode' : 'Switch to dark mode'">
                            <svg x-show="dark" class="w-4 h-4 sm:w-[18px] sm:h-[18px] text-slate-600" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="4" />
                                <path
                                    d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                            </svg>
                            <svg x-show="!dark" x-cloak class="w-4 h-4 sm:w-[18px] sm:h-[18px] text-amber-300"
                                viewBox="0 0 24 24" fill="currentColor">
                                <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
                            </svg>
                        </button>
        
                        <!-- language selector -->
                        <div x-data="{ open: false, lang: 'EN' }" class="relative">
                            <button @click="open = !open"
                                class="focus-ring flex items-center gap-1 bg-white/95 dark:bg-slate-800/95 border border-slate-200 dark:border-slate-700 rounded-md px-2.5 py-1.5 sm:px-3 text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-200 shadow-sm hover:bg-white dark:hover:bg-slate-700 transition">
                                <span x-text="lang"></span>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" :class="open && 'rotate-180'" class="transition-transform">
                                    <path d="M6 9l6 6 6-6" />
                                </svg>
                            </button>
                            <div x-show="open" @click.outside="open = false" x-cloak x-transition
                                class="absolute right-0 mt-1 w-24 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg overflow-hidden">
                                <button @click="lang='EN'; open=false"
                                    class="block w-full text-left px-3 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700">EN</button>
                                <button @click="lang='FA'; open=false"
                                    class="block w-full text-left px-3 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700">FA</button>
                            </div>
                        </div>
                    </div>
        
                    <!-- desk illustration band -->
                    <div class="absolute w-full h-[250px] xs:h-[220px] sm:h-[260px] md:h-[320px] overflow-hidden dark:from-slate-800 dark:to-slate-900 transition-colors duration-300 
                        bg-[url('./assets/img/HamidHeidarinia-Header-page.webp')]
                        bg-[length:cover]
                        lg:bg-[position:center_-11rem]
                        bg-no-repeat
                        md:bg-[position:center_-6rem]
                        sm:bg-[position:center_-6rem]
                        bg-[position:center]">
                    </div>

                        </div>
                    </div>
                </div>
            </div>
