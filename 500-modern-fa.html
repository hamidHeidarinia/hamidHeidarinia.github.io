<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>۵۰۰ - خطای سرور</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Vazirmatn', sans-serif; }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-16px); }
  }
  .float { animation: float 5s ease-in-out infinite; }

  @keyframes glow {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .glow { animation: glow 3s ease-in-out infinite; }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  .pulse-ring { animation: pulse-ring 2.5s ease-out infinite; }
</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6 relative overflow-hidden">

  <!-- گرید نقطه‌ای پس‌زمینه -->
  <div class="absolute inset-0 opacity-20"
       style="background-image: radial-gradient(circle, #64748b 1px, transparent 1px); background-size: 32px 32px;">
  </div>

  <!-- افکت‌های نوری (قرمز/نارنجی برای خطا) -->
  <div class="pointer-events-none absolute top-1/4 -left-40 w-96 h-96 bg-rose-600/30 rounded-full blur-3xl glow"></div>
  <div class="pointer-events-none absolute bottom-1/4 -right-40 w-96 h-96 bg-orange-500/20 rounded-full blur-3xl glow" style="animation-delay: 1.5s;"></div>

  <main class="relative z-10 w-full max-w-lg text-center">

    <!-- عدد 500 بزرگ -->
    <div class="relative mb-6 select-none">
      <h1 class="text-[9rem] sm:text-[11rem] leading-none font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-600">
        ۵۰۰
      </h1>
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <span class="relative flex items-center justify-center">
          <span class="absolute w-16 h-16 rounded-full bg-rose-500/40 pulse-ring"></span>
          <svg class="relative w-20 h-20 sm:w-24 sm:h-24 text-rose-400/90 float" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
        </span>
      </div>
    </div>

    <h2 class="text-2xl sm:text-3xl font-bold text-white mb-3">
      مشکلی پیش آمده است
    </h2>

    <p class="text-slate-400 leading-7 mb-10 max-w-sm mx-auto">
      خطای غیرمنتظره‌ای در سمت سرور رخ داده است. تیم فنی از این موضوع مطلع شده.
      لطفاً چند لحظه دیگر دوباره تلاش کنید.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <button onclick="location.reload()" class="group w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-full bg-white hover:bg-slate-200 transition-colors px-7 py-3.5 font-semibold text-slate-900 shadow-xl shadow-white/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 transition-transform group-hover:rotate-180 duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        تلاش دوباره
      </button>
      <a href="/" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-full bg-slate-800/60 hover:bg-slate-800 active:bg-slate-900 transition-colors px-7 py-3.5 font-semibold text-slate-200 border border-slate-700 backdrop-blur">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75" />
        </svg>
        بازگشت به خانه
      </a>
    </div>

    <!-- لینک‌های سریع -->
    <div class="mt-12 pt-6 border-t border-slate-800/80 flex items-center justify-center gap-6 text-sm">
      <a href="/" class="text-slate-500 hover:text-slate-300 transition-colors">خانه</a>
      <span class="w-1 h-1 rounded-full bg-slate-700"></span>
      <a href="/status" class="text-slate-500 hover:text-slate-300 transition-colors">وضعیت سرویس</a>
      <span class="w-1 h-1 rounded-full bg-slate-700"></span>
      <a href="/contact" class="text-slate-500 hover:text-slate-300 transition-colors">تماس با پشتیبانی</a>
    </div>
  </main>
</body>
</html>
